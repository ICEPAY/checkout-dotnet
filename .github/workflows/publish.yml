name: publish
on:
  push:
    tags:
      - 'v*.*.*'
  pull_request:
jobs:
  build_test_pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # IMPORTANT: fetch tags

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Parse version from tag name, removing an optional leading 'v'
      - name: Set VERSION env
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - run: dotnet restore
      - run: dotnet build -c Release /p:ContinuousIntegrationBuild=true

      - name: Pack with tag version
        run: |
          dotnet pack ICEPAY_CheckoutSDK/ICEPAY_CheckoutSDK.csproj \
            -c Release \
            -o artifacts \
            /p:Version=${{ env.VERSION }} \
            /p:ContinuousIntegrationBuild=true

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push artifacts/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate